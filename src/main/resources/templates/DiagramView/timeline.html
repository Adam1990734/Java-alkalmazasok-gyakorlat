<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body>
<div layout:fragment="content">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0"><i class="bi bi-graph-up text-success me-2"></i>Timeline Diagram</h2>
            <a th:href="@{/diagrams/withcount}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-bar-chart-fill me-1"></i>Switch to Bar Diagram
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <canvas id="timelineDiagram"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/timelineDiagram.js"></script>
</div>
</body>
</html>
