<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
><body><div layout:fragment="content">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <div>
        <h2>Timeline Diagram</h2>
        <canvas id="timelineDiagram"></canvas>
    </div>
    <script th:fragment="timelineDiagram" th:inline="javascript">
        const timeline = [[${timelineData}]];
        const currentYear = new Date().getFullYear();
        new Chart(
            document.getElementById('timelineDiagram'),
            {
                type: 'bar',
                data: {
                    labels: timeline.map(x => x.name),
                    datasets: [{
                        label: 'Életévek',
                        data: timeline.map(x => [
                            Number(x.birthYear),
                            Number(x.deathYear) === 0 ? currentYear : Number(x.deathYear)
                        ]),
                        backgroundColor: '#4BC0C0'
                    }]
                },
                options: {
                    indexAxis: 'y',
                    scales: {
                        x: {
                            min: 1700,
                            max: currentYear,
                            title: {
                                display: true,
                                text: 'Év'
                            }
                        }
                    }
                }
            }
        );
    </script>
</div></body></html>
