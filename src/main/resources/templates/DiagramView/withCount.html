<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
><body><div layout:fragment="content">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <div>
        <h2>Bar Diagram</h2>
        <canvas id="barDiagram"></canvas>
    </div>
    <script th:fragment="barDiagram" th:inline="javascript">
        const inventors = [[${inventorStats.![name]}]];
        const counts = [[${inventorStats.![count]}]];

        new Chart(
            document.getElementById('barDiagram'),
            {
                type: 'bar',
                data: {
                    labels: inventors,
                    datasets: [{
                        label: 'Találmányok száma',
                        data: counts,
                        backgroundColor: '#36A2EB'
                    }]
                }
            }
        );
    </script>
</div></body></html>
