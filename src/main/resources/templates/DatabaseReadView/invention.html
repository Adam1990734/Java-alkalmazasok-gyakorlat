<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body><div layout:fragment="content">
    <table>
        <thead>
            <tr>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="invention : ${inventions}">
                <td th:text="${invention.name}"></td>
            </tr>
        </tbody>
    </table>
    <div th:replace="~{Shared/pager :: pager}"></div>
    <a th:href="@{/}"></a>
</div></body>
</html>
