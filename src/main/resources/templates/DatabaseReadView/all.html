<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body>
<div layout:fragment="content">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0"><i class="bi bi-database-fill text-primary me-2"></i>All Inventors &amp; Inventions</h2>
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-house-door me-1"></i>Back to Home
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th class="ps-4">Name</th>
                            <th>Born In</th>
                            <th>Died In</th>
                            <th class="pe-4">Inventions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="inventor : ${all}">
                            <td class="ps-4 fw-semibold" th:text="${inventor.name}"></td>
                            <td th:text="${inventor.bornat}"></td>
                            <td th:text="${inventor.diedat}"></td>
                            <td class="pe-4">
                                <div class="d-flex flex-wrap gap-1">
                                        <span th:each="invention : ${inventor.getInventions()}"
                                              th:text="${invention.name}"
                                              class="badge bg-primary-subtle text-primary-emphasis border border-primary-subtle">
                                        </span>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:replace="~{Shared/pager :: pager}"></div>
    </div>
</div>
</body>
</html>
