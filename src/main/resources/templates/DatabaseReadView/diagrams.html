<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <script th:fragment="barDiagram" th:inline="javascript">
        const inventors = [[${inventorStats.![name]}]];
        const counts = [[${inventorStats.![count]}]];

        new Chart(
            document.getElementById('barDiagram'),
            {
                type: 'bar',
                data: {
                    labels: inventors,
                    datasets: [{
                        label: 'Találmányok száma',
                        data: counts,
                        backgroundColor: '#36A2EB'
                    }]
                }
            }
        );
    </script>

    <script th:fragment="timelineDiagram" th:inline="javascript">
        const timeline = [[${timelineData}]];
        const currentYear = new Date().getFullYear();
        new Chart(
            document.getElementById('timelineDiagram'),
            {
                type: 'bar',
                data: {
                    labels: timeline.map(x => x.name),
                    datasets: [{
                        label: 'Életévek',
                        data: timeline.map(x => [
                            Number(x.birthYear),
                            Number(x.deathYear) === 0 ? currentYear : Number(x.deathYear)
                        ]),
                        backgroundColor: '#4BC0C0'
                    }]
                },
                options: {
                    indexAxis: 'y',
                    scales: {
                        x: {
                            min: 1700,
                            max: currentYear,
                            title: {
                                display: true,
                                text: 'Év'
                            }
                        }
                    }
                }
            }
        );
    </script>
</html>
