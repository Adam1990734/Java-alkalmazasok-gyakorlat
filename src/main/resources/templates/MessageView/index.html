<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en"
>
<body>
<div layout:fragment="content">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0"><i class="bi bi-chat-left-text-fill text-primary me-2"></i>Messages</h2>
            <a th:href="@{/contact}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-circle me-1"></i>New Message
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th class="ps-4" style="width: 20%;">Sent by</th>
                            <th style="width: 25%;">At</th>
                            <th class="pe-4">Content</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="message : ${messages}" th:object="${message}">
                            <td class="ps-4 fw-semibold">
                                <i class="bi bi-person-circle text-secondary me-1"></i>
                                <span th:text="*{username}"></span>
                            </td>
                            <td class="text-muted small" th:text="*{createdAt}"></td>
                            <td class="pe-4" th:text="*{content}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:replace="~{Shared/pager :: pager}"></div>
    </div>
</div>
</body>
</html>
