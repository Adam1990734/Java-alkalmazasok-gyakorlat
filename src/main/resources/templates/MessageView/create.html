<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en"
>
<body>
<div layout:fragment="content">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-envelope-paper-fill fs-1 text-primary"></i>
                            <h2 class="fw-bold mt-2">Contact Us</h2>
                            <p class="text-muted small">Have a question or feedback? Send us a message below.</p>
                        </div>

                        <form method="post" th:action="@{/contact}" th:object="${message}">
                            <div class="mb-4">
                                <label for="content" class="form-label fw-semibold">Write your message here:</label>
                                <textarea id="content"
                                          th:field="*{content}"
                                          class="form-control"
                                          th:classappend="${#fields.hasErrors('content')} ? 'is-invalid' : ''"
                                          rows="5"
                                          placeholder="Type your message..."></textarea>
                                <div th:if="${#fields.hasErrors('content')}" class="invalid-feedback d-block">
                                    <i class="bi bi-exclamation-circle-fill me-1"></i>
                                    <span th:errors="*{content}"></span>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center">
                                <a th:href="@{/}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left me-1"></i>Back
                                </a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="bi bi-send-fill me-1"></i>Send Message
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
