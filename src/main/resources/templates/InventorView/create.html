<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body><div layout:fragment="content">
    <form method="post" th:action="@{/crud/inventors/create}" th:object="${inventor}">
        <div>
            <label>Name</label>
            <input th:field="*{name}">
        </div>
        <div>
            <label>Born In</label>
            <input th:field="*{bornat}">
        </div>
        <div>
            <label>Died In</label>
            <input th:field="*{diedat}">
        </div>
        <div>
            <label>Inventors:</label>
            <div th:replace="~{InventorView/selecter :: selecter}"></div>
        </div>
        <button type="submit">Add</button>
    </form>
    <a th:href="@{/crud/inventors}">Back</a>
</div></body>
</html>
