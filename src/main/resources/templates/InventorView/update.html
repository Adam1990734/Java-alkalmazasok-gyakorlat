<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body><div layout:fragment="content">
    <form method="post" th:object="${inventor}">
        <input hidden="hidden" readonly th:field="*{id}">
        <div>
            <label>Name</label>
            <input th:field="*{name}">
        </div>
        <div>
            <label>Born In</label>
            <input th:field="*{bornat}">
        </div>
        <div>
            <label>Died In</label>
            <input th:field="*{diedat}">
        </div>
        <div>
            <label>Inventors</label>
            <th:block th:each="invention : ${inventor.getInventions()}">
                <input type="checkbox" checked th:value="${invention.id}" th:text="${invention.name}">
                <br>
            </th:block>
            <th:block th:each="invention : ${inventions}">
                <input type="checkbox" th:value="${invention.id}" th:text="${invention.name}">
                <br>
            </th:block>
        </div>
        <button type="submit">Add</button>
    </form>
    <a th:href="@{/inventors}">Back</a>
</div></body>
</html>
