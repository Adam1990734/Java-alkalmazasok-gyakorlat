<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body>
<div layout:fragment="content">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm text-center p-4">
                    <div class="card-body">
                        <div class="fs-1 text-warning mb-3">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h2 class="fw-bold mb-2">Admin Page</h2>
                        <p class="text-muted mb-4">This page can only be seen by administrators.</p>

                        <div class="alert alert-warning-subtle border border-warning-subtle d-inline-block px-4 py-2 mb-4">
                            Admin: <strong sec:authentication="name"></strong>
                        </div>

                        <div class="d-flex justify-content-center gap-2 flex-wrap">
                            <a th:href="@{/crud/inventors}" class="btn btn-warning btn-sm fw-semibold">
                                <i class="bi bi-people-fill me-1"></i>Manage Inventors
                            </a>
                            <a th:href="@{/crud/inventions}" class="btn btn-dark btn-sm">
                                <i class="bi bi-gear-fill me-1"></i>Manage Inventions
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
