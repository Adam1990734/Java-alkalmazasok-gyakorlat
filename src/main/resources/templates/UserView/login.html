<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
    <body><div layout:fragment="content">
        <div th:if="${param.registered}" style="color: green;">Successful registration! You can log in.</div>
        <div th:if="${param.error}" style="color: red;">Incorrect username or password!</div>
        <form th:action="@{/login}" method="post">
            <label>Username:</label><input type="text" name="username"><br>
            <label>Password:</label><input type="password" name="password"><br>
            <button type="submit">Login</button>
        </form>
    </div></body>
</html>
