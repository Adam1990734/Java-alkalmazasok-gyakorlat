<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body>
<div layout:fragment="content">
        <div class="container my-5">
                <div class="row justify-content-center">
                        <div class="col-md-7 col-lg-5">
                                <div class="card border-0 shadow-sm text-center p-4">
                                        <div class="card-body">
                                                <div class="fs-1 text-primary mb-3">
                                                        <i class="bi bi-person-badge-fill"></i>
                                                </div>
                                                <h2 class="fw-bold mb-2">User Page</h2>
                                                <p class="text-muted mb-4">This page can be seen by logged-in users.</p>

                                                <div class="alert alert-light border d-inline-block px-4 py-2 mb-4">
                                                        Logged in as: <strong class="text-primary" sec:authentication="name"></strong>
                                                </div>

                                                <div class="d-flex justify-content-center gap-2">
                                                        <a th:href="@{/message}" class="btn btn-primary btn-sm">
                                                                <i class="bi bi-envelope me-1"></i>View Messages
                                                        </a>
                                                        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
                                                                <i class="bi bi-house-door me-1"></i>Home
                                                        </a>
                                                </div>
                                        </div>
                                </div>
                        </div>
                </div>
        </div>
</div>
</body>
</html>
