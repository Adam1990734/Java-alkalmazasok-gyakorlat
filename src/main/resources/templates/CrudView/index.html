<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body><div layout:fragment="content">
    <form th:fragment="tablechooser" method="get">
        <div>
            <label>Choose a table from bellow:</label>
            <select name="chosen">
                <option th:text="${chosen}"></option>
                <option th:each="ch : ${availableTables}" th:if="${ch != chosen}" th:value="${ch}" th:text="${ch}"></option>
            </select>
        </div>
        <button type="submit">Select</button>
    </form>
</div></body>
</html>
