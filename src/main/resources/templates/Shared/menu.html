<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<body>
    <nav th:fragment="menu">
        <span>
            <a th:href="@{/}">Fooldal</a>
        </span>
        <span sec:authorize="isAuthenticated()">
            | <a th:href="@{/user}">User</a>
        </span>
        <span sec:authorize="hasRole('ADMIN')">
            | <a th:href="@{/admin}">Admin</a>
        </span>
        <span>
            | <a th:href="@{/contact}">Contact</a>
        </span>
        <span sec:authorize="isAuthenticated()">
            <!-- Ez még nincs kész -->
            | <a th:href="@{/message}">Messages</a>
        </span>
        <span>
            <!-- Ez még nincs kész -->
            | <ul>
                <li><a th:href="@{/show/inventors}">inventors</a></li>
                <li><a th:href="@{/show/inventions}">inventions</a></li>
              </ul>
        </span>
        <span>
            | <ul>
                <li><a th:href="@{/diagrams/withcount}">withcounts</a></li>
                <li><a th:href="@{/diagrams/timeline}">timeline</a></li>
              </ul>
        </span>
        <span sec:authorize="hasRole('ADMIN')">
            <!-- Ez az adminnak van (nincs még kész) -->
            | <ul>
                <li><a th:href="@{/crud/inventors}">inventors</a></li>
                <li><a th:href="@{/crud/inventions}">inventions</a></li>
              </ul>
        </span>
        <span sec:authorize="isAnonymous()">
            | <a th:href="@{/register}">Register</a>
            | <a th:href="@{/login}">Login</a>
        </span>
        <span sec:authorize="isAuthenticated()">
            | <form th:action="@{/logout}" method="post" style="display: inline">
                <button type="submit">Logout</button>
            </form>
        </span>
    </nav>
</body>
</html>
