<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body><div layout:fragment="content">
    <form method="post" th:action="@{/crud/inventions/create}" th:object="${invention}">
        <div>
            <label>Name</label>
            <input th:field="*{name}">
        </div>
        <button type="submit">Add</button>
    </form>
    <a th:href="@{/crud/inventions}">Back</a>
</div></body>
</html>
