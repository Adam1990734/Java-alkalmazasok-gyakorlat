<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body><div layout:fragment="content">
    <form method="post" th:object="${invention}">
        <div>
            <label>Name</label>
            <input th:field="*{name}">
        </div>
        <div>
            <label>Inventors</label>
            <select th:field="*{inventorIds}">
                <option th:each="inventor : ${invention.getInventorIds()}" th:value="${inventor}"></option>
            </select>
        </div>
        <button type="submit">Add</button>
    </form>
</div></body>
</html>
