<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body><div layout:fragment="content">
    <form method="post" th:object="${invention}">
        <input hidden="hidden" readonly th:field="*{id}">
        <div>
            <label>Name</label>
            <input th:field="*{name}">
        </div>
        <div>
            <label>Inventors</label>
            <input type="checkbox" checked th:each="inventor : ${invention.getInventors()}" th:value="${inventor.id}" th:text="${inventor.name}">
            <input type="checkbox" th:each="inventor : ${inventors}" th:value="${inventor.id}" th:text="${inventor.name}">
        </div>
        <button type="submit">Add</button>
    </form>
</div></body>
</html>
