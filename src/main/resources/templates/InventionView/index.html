<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body><div layout:fragment="content">
    <a th:href="@{/crud/inventions/create}">Create new invention</a>
    <table th:fragment="inventionDisplayer">
        <thead>
            <tr>
                <th>Name</th>
                <th th:if="${hasOperations}">Operations</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="invention : ${inventions}">
                <td th:text="${invention.name}"></td>
                <td th:if="${hasOperations}">
                    <a th:href="@{/crud/inventions/details/{id}(id=${invention.id})}">Details</a>
                    <a th:href="@{/crud/inventions/update/{id}(id=${invention.id})}">Edit</a>
                    <a th:href="@{/crud/inventions/delete/{id}(id=${invention.id})}">Remove</a>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:replace="~{Shared/pager :: pager}"></div>
</div></body>
</html>
