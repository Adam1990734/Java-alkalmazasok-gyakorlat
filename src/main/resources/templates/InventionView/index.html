<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body><div layout:fragment="content">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Inventors</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="invention : ${inventions}">
                <td th:text="${invention.name}"></td>
                <td>
                    <ul th:if="${invention.getInventors().size() > 0}">
                        <li th:each="inventor : ${invention.getInventors()}" th:text="${inventor.name}"></li>
                    </ul>
                    <p th:if="${invention.getInventors().size() == 0}">There is no related inventor yet!</p>
                </td>
            </tr>
        </tbody>
    </table>
</div></body>
</html>
