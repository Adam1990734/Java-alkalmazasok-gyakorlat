<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Shared/mainlayout}"
      lang="en"
>
<body><div layout:fragment="content">
    <a th:href="@{/inventions/create}">Create new invention</a>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Inventors</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="invention : ${inventions}">
                <td th:text="${invention.name}"></td>
                <td>
                    <a th:href="@{/inventions/details/{id}(id=${invention.id})}">Details</a>
                    <a th:href="@{/inventions/update/{id}(id=${invention.id})}">Edit</a>
                    <a th:href="@{/inventions/delete/{id}(id=${invention.id})}">Remove</a>
                </td>
            </tr>
        </tbody>
    </table>
</div></body>
</html>
